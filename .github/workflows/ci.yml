# SPDX-License-Identifier: Apache-2.0
# Build & test on every push to main and on pull requests (plus manual dispatch).
#
# ⚠️ This crate had NO ci workflow until 2026-08-23 — only a release workflow, which builds the
# binary but never runs `cargo test`. So nothing ran the suite, and the suite had stopped
# compiling: a signature change to `cut_rows` left two stale call sites, and both examples drive
# the `gen-write` surface without declaring they need it. Neither is a defect in the library; both
# made the whole suite unrunnable, which is worse, because it hides the ones that would be.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vyges-tools-opendb
    steps:
      # ⚠️ Sibling layout so the `[patch]` path entry resolves. A patch whose path does not exist
      # is a hard `failed to load source`, not a fall-back to the git source being patched.
      - uses: actions/checkout@v4
        with:
          path: vyges-tools-opendb
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/opendb-lib
          path: vyges-tools-opendb-lib
      # ⚠️ EVERY [patch] entry needs a checkout, not just the obvious one. This workflow's first
      # run failed here: it checked out opendb-lib and not layout, and cargo stopped with
      # "failed to load source for dependency vyges-layout" before compiling anything.
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/layout
          path: vyges-tools-layout
      # loom joined the patch table when `import --verilog` landed: it supplies the structural
      # netlist reader. The check below caught its absence on the first run after that.
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/loom
          path: vyges-tools-loom

      # 🔑 Check the sibling layout BEFORE cargo does, so a missing one names itself. Cargo's
      # error points at a path and leaves you to work out which repo belongs there; this reads
      # the [patch] sections and says exactly what is absent. It also catches a patch added later
      # without a matching checkout, which is how this broke in the first place.
      - name: Every [patch] path has a checkout
        run: |
          python3 - <<'PY'
          import re, os, sys
          s = open("Cargo.toml").read()
          missing = []
          for b in re.split(r"\n(?=\[)", s):
              if not b.startswith("[patch."):
                  continue
              for m in re.finditer(r'^(\S+)\s*=\s*\{[^}]*path\s*=\s*"([^"]+)"', b, re.M):
                  crate, path = m.group(1), m.group(2)
                  if not os.path.exists(os.path.join(path, "Cargo.toml")):
                      missing.append((crate, path))
          for crate, path in missing:
              print(f"MISSING  {crate} is patched to {path}, which has no Cargo.toml -- "
                    f"add an actions/checkout for the repo that belongs there", file=sys.stderr)
          sys.exit(1 if missing else 0)
          PY

      - name: Toolchain
        # Boost (headers) + zlib only; fmt/spdlog/abseil are built from source by libodb's build.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git bison libboost-dev libboost-iostreams-dev libbz2-dev zlib1g-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Test (default surface)
        run: cargo test --release --verbose

      # 🔑 **Both, always.** `gen-write` gates the generated setter surface — including the whole
      # 3D/chiplet write path — and it carries test binaries the default build never compiles, let
      # alone runs. Testing only the default leaves that surface unexercised while looking green.
      - name: Test (with gen-write, the L2/write surface)
        run: cargo test --release --features gen-write --verbose

      # The examples ARE the 3D/chiplet write path in use, so a compile is a real check on it.
      - name: Examples build (they require gen-write)
        run: cargo build --release --features gen-write --examples --verbose
