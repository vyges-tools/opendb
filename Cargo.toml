[package]
name = "vyges-opendb"
version = "0.1.34"
edition = "2021"
license = "Apache-2.0"
description = "Safe, ergonomic Rust API for OpenROAD's OpenDB (libodb) — read + ECO write path."
repository = "https://github.com/vyges-tools/opendb"

# ⚠️ **Both examples drive the WRITE path**, which lives behind `gen-write` — so they must say
# so, or `cargo test` (which builds examples) fails to compile with "no method named
# chip_set_width", and the whole suite goes red over a feature flag rather than a defect. That is
# how this crate's tests came to be uncompilable: the failure reads like a missing 3D API and is
# actually a missing `required-features`.
#
# ℹ️ The 3D/chiplet surface itself is intact either way — `chip_set_width`, `place_chip_inst` and
# the rest are generated and present; `gen-write` is a governance gate on mutation, not a
# capability that comes and goes.
[[example]]
name = "draw_stack"
required-features = ["gen-write"]

[[example]]
name = "d2d_gap"
required-features = ["gen-write"]

[features]
# L2/governance-gated generated setter surface — forwards to the lib crate's feature.
gen-write = ["vyges-opendb-lib/gen-write"]

[dependencies]
# git so external consumers (e.g. vyges-cli) can pull this crate directly; the [patch]
# below redirects to the sibling checkout for local development.
vyges-opendb-lib = { git = "https://github.com/vyges-tools/opendb-lib.git" }
cxx = "1"
# The shared scene/SVG/PNG renderer, so the 3D drawing is not a second copy of the one in
# vyges-gds-view. Pure Rust — it brings no C toolchain along with it.
vyges-layout = { git = "https://github.com/vyges-tools/layout", branch = "main" }
# 🔑 The shared data plane, for its structural Verilog reader. loom does NOT depend on opendb,
# so this introduces no cycle — and the reverse would put libodb under the data plane, which is
# what keeps loom building offline everywhere.
vyges-loom = { git = "https://github.com/vyges-tools/loom.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 3Dblox interchange files are YAML (plus a macro preprocessor of their own). Pure Rust: no C,
# no build system, no version pin — the opposite of the dependency this reader exists to avoid.
yaml-rust2 = "0.10"
# Structured events (vyges-events/1.0) for the MCP causal trail — centralizes odb's Rust-side
# diagnostics (get/set API misses) with the rest of the Loom suite. Core-only (no tracing bridge).
vyges-events = { git = "https://github.com/vyges-tools/events", branch = "main", default-features = false }

# The one binary shipped by `vyges install opendb`. Subcommands (info, insert-eco-buffers)
# live inside it; Loom steps invoke `vyges-opendb insert-eco-buffers ...`.
[[bin]]
name = "vyges-opendb"
path = "src/bin/vyges-opendb.rs"

# Local dev: build against the sibling checkout instead of the git version. Ignored by
# downstream consumers (patches are only honored from the root/workspace manifest).
[patch."https://github.com/vyges-tools/opendb-lib.git"]
vyges-opendb-lib = { path = "../vyges-tools-opendb-lib" }

[patch."https://github.com/vyges-tools/loom.git"]
vyges-loom = { path = "../vyges-tools-loom" }

[patch."https://github.com/vyges-tools/layout"]
vyges-layout = { path = "../vyges-tools-layout" }
